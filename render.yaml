# Render Blueprint for the i am Architect BACKEND - staging.
# See DEPLOYMENT.md "4. Render staging". The frontend is on Vercel; this
# file describes only the Node backend.
#
# No secret belongs in this file. AI_PROVIDER is a plain, non-secret
# value (which of the two already-implemented AIProvider classes to use -
# see src/engine/ai/providers/); every OTHER environment variable below
# is declared with `sync: false` and no value: Render asks for each value
# when the Blueprint is applied, and stores it encrypted in the dashboard
# (the service -> Environment).
#
# PORT is deliberately not set: Render sets it (10000) and the server listens
# on whatever PORT says, on all interfaces. NODE_ENV=production comes from
# the Dockerfile.
services:
  - type: web
    name: iarchitect-backend-staging
    runtime: docker
    # The build context is the repository root: the backend imports the
    # shared engine in src/engine/. .dockerignore keeps every .env file out.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Render has no Sydney region; Singapore is the closest to the staging
    # Supabase project (AWS ap-southeast-2, Sydney).
    region: singapore
    plan: free
    branch: master
    healthCheckPath: /health
    envVars:
      # Staging defaults to Gemini (no paid OpenAI key required) - see
      # backend/src/config.ts. To use OpenAI instead, change this value to
      # "openai" and add an OPENAI_API_KEY variable in Render -> Environment
      # (this Blueprint does not declare one; OpenAIProvider stays fully
      # supported in the code either way - see src/engine/ai/providers/).
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
