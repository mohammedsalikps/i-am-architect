# Fly.io configuration for the BACKEND (see DEPLOYMENT.md "Deploy the backend").
# The app name is yours to choose - change it before `fly launch --copy-config`
# / `fly deploy`. No secret belongs in this file: set them with `fly secrets set`.
app = "iarchitect-backend-staging"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
