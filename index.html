<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>i am Architect</title>
    <style>
      /* Full-window, minimal, distraction-free viewport for the 3D workspace.
         The app shell is exactly one viewport tall and scrolls inside its own
         regions (see src/ui/styles.css "Shell layout"), so the page itself
         normally never scrolls. overflow-y is still auto (not hidden) as a
         last resort for a window too short for the fixed chrome plus the
         viewport's minimum height - scrolling the page then is preferable to
         clipping content. overflow-x stays hidden so nothing can ever force
         page-level horizontal scroll. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        background: #1a1a1a;
      }

      #app {
        width: 100vw;
        min-height: 100vh;
      }

      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
