<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>i am Architect</title>
    <style>
      /* Full-window, minimal, distraction-free viewport for the 3D workspace.
         The app shell is exactly one viewport tall and scrolls inside its own
         regions (see src/ui/styles.css "Shell layout"), so the page itself
         normally never scrolls. overflow-y is still auto (not hidden) as a
         last resort for a window too short for the fixed chrome plus the
         viewport's minimum height - scrolling the page then is preferable to
         clipping content. overflow-x stays hidden so nothing can ever force
         page-level horizontal scroll. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        background: #1a1a1a;
      }

      #app {
        width: 100vw;
        min-height: 100vh;
      }

      canvas {
        display: block;
      }

      /* ---------- Eavara startup screen ----------
         EAVARA - THE SCHOOL OF ARCHITECTURE, shown while the workspace starts.
         Its markup and styles live here, in the page itself, so it is painted
         on the very first frame - before any script runs and before the
         workspace exists. The animation is pure CSS: the production
         Content-Security-Policy allows no inline script. src/ui/splash.ts
         decides when it leaves (about 1.8 s after page load, once the
         workspace has painted; any key, click or tap skips it). */
      .eavara-splash {
        --eavara-green: #25492b;
        --eavara-cream: #f7f3ea;
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: hidden;
        background-color: var(--eavara-cream);
        /* A faint drafting grid - architectural, never busy. */
        background-image:
          linear-gradient(rgba(37, 73, 43, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(37, 73, 43, 0.045) 1px, transparent 1px);
        background-size: 48px 48px;
        background-position: center center;
        transition: opacity 0.45s ease;
        /* Failsafe: if the app never starts (and so never releases it), the
           screen still gets out of the way. */
        animation: eavara-failsafe 0.4s ease 8s forwards;
      }

      .eavara-splash--leaving {
        opacity: 0;
        pointer-events: none;
      }

      .eavara-splash__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 100%;
        transition: transform 0.45s ease;
      }

      .eavara-splash--leaving .eavara-splash__content {
        transform: scale(0.985);
      }

      /* The mark: the EAVARA wordmark, built left to right. */
      .eavara-splash__mark {
        position: relative;
        width: min(560px, 78vw);
        aspect-ratio: 800 / 180;
      }

      .eavara-splash__mark svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      /* 1. Drafting lines - cap line and baseline - drawn first, then erased. */
      .eavara-splash__guides {
        opacity: 0;
        animation: eavara-guides 1.7s linear both;
      }

      .eavara-splash__guides line {
        stroke: var(--eavara-green);
        stroke-width: 1.5;
        stroke-dasharray: 1;
        stroke-dashoffset: 0;
        animation: eavara-draw 0.5s cubic-bezier(0.4, 0, 0.2, 1) 0.05s both;
      }

      /* 2. The letters, revealed left to right along the drafting lines. */
      .eavara-splash__build {
        position: absolute;
        inset: 0;
        animation: eavara-wipe 0.8s cubic-bezier(0.65, 0, 0.35, 1) 0.25s both;
      }

      .eavara-splash__letters {
        fill: var(--eavara-green);
      }

      /* 3. The ridge line cut through the letters, drawn left to right. */
      .eavara-splash__ridge {
        fill: none;
        stroke: var(--eavara-cream);
        stroke-width: 6;
        stroke-linejoin: round;
        stroke-linecap: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 0;
        animation: eavara-draw 0.55s cubic-bezier(0.4, 0, 0.2, 1) 0.85s both;
      }

      /* 4. The pines grow, left to right. */
      .eavara-splash__pine {
        fill: var(--eavara-green);
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: eavara-grow 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .eavara-splash__pine--1 {
        animation-delay: 0.95s;
      }

      .eavara-splash__pine--2 {
        animation-delay: 1.03s;
      }

      .eavara-splash__pine--3 {
        animation-delay: 1.22s;
      }

      .eavara-splash__pine--4 {
        animation-delay: 1.3s;
      }

      /* 5. THE SCHOOL OF ARCHITECTURE, between two rules. */
      .eavara-splash__tagline {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: clamp(18px, 3.2vw, 30px) 0 0;
        color: var(--eavara-green);
        font: 600 clamp(11px, 1.35vw, 15px) / 1 "Montserrat", "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        letter-spacing: 0.34em;
        white-space: nowrap;
      }

      .eavara-splash__tagline-text {
        display: inline-block;
        /* letter-spacing also trails the last letter - pull it back so the
           text sits centred between the rules. */
        margin-right: -0.34em;
        animation: eavara-rise 0.5s ease 1.2s both;
      }

      .eavara-splash__rule {
        width: clamp(20px, 7vw, 72px);
        height: 1px;
        background: var(--eavara-green);
        opacity: 0.7;
        animation: eavara-rule 0.45s cubic-bezier(0.4, 0, 0.2, 1) 1.1s both;
      }

      .eavara-splash__rule--left {
        transform-origin: right center;
      }

      .eavara-splash__rule--right {
        transform-origin: left center;
      }

      @media (max-width: 520px) {
        .eavara-splash__tagline {
          gap: 10px;
          letter-spacing: 0.2em;
        }

        .eavara-splash__tagline-text {
          margin-right: -0.2em;
        }

        .eavara-splash__rule {
          width: 18px;
        }
      }

      @keyframes eavara-draw {
        from {
          stroke-dashoffset: 1;
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes eavara-wipe {
        from {
          clip-path: inset(0 100% 0 0);
        }
        to {
          clip-path: inset(0 0 0 0);
        }
      }

      @keyframes eavara-guides {
        0% {
          opacity: 0.45;
        }
        70% {
          opacity: 0.45;
        }
        100% {
          opacity: 0;
        }
      }

      @keyframes eavara-grow {
        from {
          transform: scaleY(0);
        }
        to {
          transform: scaleY(1);
        }
      }

      @keyframes eavara-rule {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }

      @keyframes eavara-rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes eavara-failsafe {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      /* Reduced motion: no animation at all - the finished mark, shown
         briefly and removed without a fade (src/ui/splash.ts). */
      @media (prefers-reduced-motion: reduce) {
        .eavara-splash,
        .eavara-splash__content {
          transition: none;
        }

        .eavara-splash__guides,
        .eavara-splash__guides line,
        .eavara-splash__build,
        .eavara-splash__ridge,
        .eavara-splash__pine,
        .eavara-splash__rule,
        .eavara-splash__tagline-text {
          animation: none;
        }

        .eavara-splash {
          animation-duration: 0.01s;
        }
      }
    </style>
  </head>
  <body>
    <!-- Eavara startup screen (see the styles above and src/ui/splash.ts).
         Decorative: hidden from assistive technology, and nothing in it can
         take focus. -->
    <div id="eavara-splash" class="eavara-splash" aria-hidden="true">
      <div class="eavara-splash__content">
        <div class="eavara-splash__mark">
          <svg class="eavara-splash__guides" viewBox="0 0 800 180" focusable="false">
            <line x1="0" y1="20" x2="800" y2="20" pathLength="1" />
            <line x1="0" y1="160" x2="800" y2="160" pathLength="1" />
          </svg>
          <div class="eavara-splash__build">
            <svg viewBox="0 0 800 180" focusable="false" role="img" aria-label="EAVARA">
              <defs>
                <!-- E A V A R A as geometric letterforms (evenodd: the A and R counters are holes). -->
                <path
                  id="eavara-letters"
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M0 20H100V52H38V74H90V104H38V128H100V160H0Z
                     M118 160L170 20H196L248 160H212L202 132H164L154 160Z M174.8 104H191.2L183 81.8Z
                     M256 20H292L321 98L350 20H386L334 160H308Z
                     M394 160L446 20H472L524 160H488L478 132H440L430 160Z M450.8 104H467.2L459 81.8Z
                     M540 20H604C632 20 650 38 650 62C650 82 640 96 624 102L656 160H614L586 106H576V160H540Z
                     M576 50H600C609 50 614 56 614 63C614 70 609 76 600 76H576Z
                     M664 160L716 20H742L794 160H758L748 132H710L700 160Z M720.8 104H737.2L729 81.8Z"
                />
                <!-- A pine, standing on its own origin. -->
                <path id="eavara-pine" d="M0 -22L4 -15H2L6 -9H3L7 -3H1V0H-1V-3H-7L-3 -9H-6L-2 -15H-4Z" />
                <clipPath id="eavara-letter-clip">
                  <use href="#eavara-letters" />
                </clipPath>
              </defs>
              <use class="eavara-splash__letters" href="#eavara-letters" />
              <!-- Pines in the E's lower counter, and between the last A's legs. -->
              <g transform="translate(58 128)"><use class="eavara-splash__pine eavara-splash__pine--1" href="#eavara-pine" /></g>
              <g transform="translate(78 128) scale(0.8)"><use class="eavara-splash__pine eavara-splash__pine--2" href="#eavara-pine" /></g>
              <g transform="translate(718 160)"><use class="eavara-splash__pine eavara-splash__pine--3" href="#eavara-pine" /></g>
              <g transform="translate(740 160) scale(0.8)"><use class="eavara-splash__pine eavara-splash__pine--4" href="#eavara-pine" /></g>
              <!-- The mountain ridge, visible only where it crosses the letters. -->
              <path
                class="eavara-splash__ridge"
                clip-path="url(#eavara-letter-clip)"
                pathLength="1"
                d="M-4 104L18 100L30 94L40 99L52 96L66 101L84 97L104 102L128 95L146 99L162 92L176 97L198 94L214 100L236 96L258 101L280 93L296 98L318 95L336 101L358 96L378 100L402 94L418 98L436 91L452 96L474 94L492 100L514 96L536 101L560 95L578 99L598 93L614 97L636 95L656 101L680 96L698 99L716 92L732 97L754 95L774 100L804 97"
              />
            </svg>
          </div>
        </div>
        <p class="eavara-splash__tagline">
          <span class="eavara-splash__rule eavara-splash__rule--left"></span>
          <span class="eavara-splash__tagline-text">THE SCHOOL OF ARCHITECTURE</span>
          <span class="eavara-splash__rule eavara-splash__rule--right"></span>
        </p>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
